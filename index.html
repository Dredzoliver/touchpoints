<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B2B2B">
  <title>Touchpoints Admin</title>
  <link rel="icon" href="../icon-192.png">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header>
    <div class="top">
      <div class="brand"><img src="../logo.png" alt="Cignal" class="logo"><h1>Touchpoints Admin</h1></div>
      <div class="top-right">
        <small id="who"></small>
        <span id="net" class="net">● Online</span>
        <button id="logoutBtn" class="icon-btn" hidden>Log out</button>
      </div>
    </div>
    <nav id="tabs" hidden>
      <button data-tab="dashboard" class="on">Dashboard</button>
      <button data-tab="approvals">Approvals <b id="apprCount" class="cnt" hidden></b></button>
    </nav>
  </header>
  <main id="view"></main>
  <div id="toast"></div>
  <script src="../config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
