<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2330">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Touchpoints">
  <title>Cignal Touchpoints Request</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="top">
      <img src="logo.png" alt="Cignal" class="logo">
      <div class="top-right">
        <span id="net" class="net">● Online</span>
        <button id="menuBtn" class="icon-btn" hidden aria-label="Menu">☰</button>
      </div>
    </div>
    <h1>Touchpoints Request</h1>
    <small id="who"></small>
  </header>

  <div id="menu" class="menu" hidden>
    <button id="refreshBtn">↻ Update data</button>
    <button id="logoutBtn">⎋ Log out</button>
  </div>

  <div id="installBar" class="install" hidden>
    <span>Install this app on your phone so it works without signal.</span>
    <button id="installBtn">Install</button>
  </div>

  <main id="view"></main>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
